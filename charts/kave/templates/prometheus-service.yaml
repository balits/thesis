{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "kave.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    {{- include "kave.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
