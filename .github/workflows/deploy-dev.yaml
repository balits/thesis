name: Deploy dev (skip tests)

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'image tag, leave empty for git SHA'
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KAVE_DOMAIN: kave.balits.net

jobs:
  build-img:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          tag_override: ${{ inputs.tag_override }}

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-img
    steps:
      - uses: actions/checkout@v6
      - name: Deploy K8S to CIVO
        uses: "./.github/actions/deploy-k8s-to-civo"
        with:
          kubeconfig_b64: ${{ secrets.KUBECONFIG_B64 }}
          app_name: "kave"
          image_tag: ${{ needs.build-img.outputs.image_tag }}
          admin_token: "${{ secrets.ADMIN_TOKEN }}"
