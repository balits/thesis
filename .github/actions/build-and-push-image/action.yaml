name: Build and push docker image
description: Build and tag the latest kave image, then push to ghcr.io

inputs:
  github_token:
    description: secret github token for registry authentication
    required: true
  registry:
    description: name of the container registry
    required: true
  image_name:
    description: name of the image
    required: true
  tag_override:
    description: override tag (leave empty for short SHA)
    required: false
    default: ''

outputs:
  image_tag:
    description: tag used for the image, override or short SHA
    value: ${{ steps.get-sha.outputs.short_sha }}

runs:
  using: composite
  steps:
    - name: Set up docker-buildx
      uses: docker/setup-buildx-action@v3

    - name: Get short SHA
      id: get-sha
      shell: bash
      run: |
        if [ -n "${{ inputs.tag_override }}" ]; then
          echo "short_sha=${{ inputs.tag_override }}" >> $GITHUB_OUTPUT
        else
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Extract Image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: |
          # tag with short commit SHA (ghcr.io/balits/kave/:xyz123)
          type=raw,value=${{ steps.get-sha.outputs.short_sha }}
          # + tag as latest
          type=raw,value=latest,enable=true
    
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # use GitHub Actions cache to speed up subsequent builds
        cache-from: type=gha
        cache-to: type=gha,mode=max